[general]
framerate = 30
bars = 20
bar_width = 2
bar_spacing = 1
sleep_timer = 1
autosens = 1
lower_cutoff_freq = 50
higher_cutoff_freq = 12000

[input]
method = pipewire
source = auto

[output]
method = raw
data_format = ascii
ascii_max_range = 1000
bar_delimiter = 59
frame_delimiter = 10

[smoothing]
# modern smoothing (integral/gravity deprecated since cava 0.8.0)
noise_reduction = 85
# monstercat = neighbour bell-curve falloff; smoother small-bar look
monstercat = 1.5
waves = 0

[eq]
1 = 1.00
2 = 1.02
3 = 1.05
4 = 1.07
5 = 1.10
