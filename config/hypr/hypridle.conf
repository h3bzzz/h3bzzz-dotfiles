# hypridle.conf — Rose Pine Hyprland setup
#
# Idle ladder:
#     5 min   dim the backlight          (cheap visual warning)
#    10 min   thornwatch screensaver     (undims itself so effects are visible)
#    15 min   hard lock                  (fires whether or not the saver is up)
#   +30 sec   display off                (armed by the lock, not by this file --
#                                         see listener 4 for why)
#
# Coming back from the screensaver always goes through hyprlock. That is the
# whole point of it — an unattended machine that has been idle ten minutes
# should not hand the desktop back on a keypress.
#
# The saver has no wake logic of its own any more. It used to poll /dev/tty and
# treat any byte as a keystroke, which meant the terminal's own focus-in and
# query-reply bytes killed it about a second after every start — so it never
# survived to be seen. Real input now arrives here, via ext-idle-notify, and
# this file is the only thing that decides when the saver dies and the lock
# screen appears.

general {
    # Everything about locking lives in lock-session.sh: tearing the saver
    # down, refusing to stack a second hyprlock, arming the display-off
    # watchdog, and cleaning up on unlock. This is the single place hyprlock is
    # spawned; ctl.sh reaches it through `loginctl lock-session`, which lands
    # back here.
    lock_cmd         = ~/.config/hypr/scripts/lock-session.sh
    # Fires on logind's LockedHint going false. The script already cleans up
    # after itself when hyprlock returns normally, so this only covers the case
    # where the wrapper was killed out from under the lock.
    on_unlock_cmd    = ~/.config/hypr/scripts/lock-session.sh unlocked
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd  = hyprctl dispatch dpms on
    ignore_dbus_inhibit = false   # respect apps that request idle inhibit (video, etc.)
}

# 1. Dim screen after 5 min of idle (visual cue, saves eyes)
#    Guarded: the saver's window map counts as activity, so this listener
#    re-arms and comes around again while the saver is up. Without the guard it
#    would dim the effects to 20% five minutes in.
listener {
    timeout  = 300
    on-timeout = ~/.config/hypr/thornwatch/ctl.sh active || brightnessctl -s set 20%
    on-resume  = brightnessctl -r          # restore saved brightness
}

# 2. thornwatch screensaver after 10 min.
#    on-resume is the wake path: it tears the saver down and raises hyprlock,
#    so any key, pointer move or touchpad tap lands on the login screen.
listener {
    timeout  = 600
    on-timeout = ~/.config/hypr/thornwatch/ctl.sh start
    on-resume  = ~/.config/hypr/thornwatch/ctl.sh wake
}

# 3. Backstop hard lock. Normally the saver locks itself first: it has its own
#    TW_LOCK_AFTER budget (5 min of saver = 15 min total), which it has to own
#    because mapping its window restarts hypridle's idle clock and this
#    listener would otherwise measure from the wrong moment. This stays as the
#    path for an idle session where the saver never came up at all.
listener {
    timeout  = 900
    on-timeout = ~/.config/hypr/thornwatch/ctl.sh lock
}

# 4. Display-off backstop, NOT the primary path.
#
#    The real "go dark shortly after locking" step is the watchdog armed inside
#    lock-session.sh, because only the lock itself knows when the lock
#    happened. This listener cannot: the saver's window map resets hypridle's
#    idle clock at t=600, so by the time the saver locks at t=900 this counter
#    only reads 300, and a 930 timeout lands at t=1530 -- ten and a half
#    minutes of lit panel on a locked machine. It stays purely as cover for an
#    idle session where no lock ever happened at all.
#
#    Waking is not this listener's job either: misc:mouse_move_enables_dpms and
#    misc:key_press_enables_dpms are both true in lua/settings.lua, so input
#    brings the panel back on its own. on-resume is kept as cheap insurance.
listener {
    timeout  = 930
    on-timeout = hyprctl dispatch dpms off
    on-resume  = hyprctl dispatch dpms on
}

# 5. Suspend after 30 min (optional — comment out if you don't want suspend)
# listener {
#     timeout  = 1800
#     on-timeout = systemctl suspend
# }
