general {
	lock_cmd = pidof hyprlock || hyprlock
	before_sleep_cmd = loginctl lock-session
	after_sleep_cmd = hyprctl dispatch dpms on
	ignore_dbus_inhibit = true
	ignore_wayland_inhibit = true
}

listener {
	timeout = 480
	on-timeout = notify-send -u low "Idle Warning" "Locking in 2 minutes..."
	on-resume = notify-send -u low "Welcome back" "Session unlocked"
}

listener {
	timeout = 540
	on-timeout = /home/h3bzzz/.config/hypr/screensaver/start-screensaver.sh
	on-resume = /home/h3bzzz/.config/hypr/screensaver/dismiss-screensaver.sh
}

listener {
	timeout = 1770
	on-timeout = hyprctl dispatch dpms off
	on-resume = hyprctl dispatch dpms on
}

listener {
	timeout = 1800
	on-timeout = systemctl suspend
}
