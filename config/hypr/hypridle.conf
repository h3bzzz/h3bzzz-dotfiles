general {
	lock_cmd = pidof hyprlock || hyprlock
	before_sleep_cmd = loginctl lock-session
	after_sleep_cmd = hyprctl dispatch dpms on
	ignore_dbus_inhibit = false
}
listener { timeout = 540; on-timeout = notify-send -u low "Idle Warning" "Locking in 30 seconds..." }
listener { timeout = 550; on-timeout = ~/.config/hypr/screensaver/start-screensaver.sh; on-resume = pkill -f "kitty --class tte-screensaver" }
listener { timeout = 570; on-timeout = loginctl lock-session }
listener { timeout = 600; on-timeout = hyprctl dispatch dpms off; on-resume = hyprctl dispatch dpms on }
listener { timeout = 1800; on-timeout = systemctl suspend }
