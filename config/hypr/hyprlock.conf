# hyprlock.conf — Rose Pine Moon lock screen
# hyprlock 0.9.6
#
# Layout (all offsets are from the centre of the screen unless a block says
# otherwise). Widgets are drawn in declaration order, so the glass card has to
# come before anything that sits on top of it:
#
#   +227   $USER
#   +201   host
#   +169   hairline divider
#    +77   clock
#    +15   date
#    -55   greeting
#   -123   input field
#   -193   caps-lock warning
#   -234   keyboard layout
#
# There is no avatar. It was a ring above the username holding, at various
# points, a stripped-out glyph (so: an empty circle), a 110x110 photo that sat
# at nearly the same value as the translucent card and read as a smudge, and a
# terminal glyph. None of them earned the space -- an empty-looking ring is
# worse than no ring, and the clock is the thing this screen is actually for.
#
# The card was resized with it, 748 -> 616. Dropping three widgets without
# doing that would have left ~130px of dead space at each end instead of the
# 66 below. The content column now runs from the top of the username (+227 +15
# = +242) to the bottom of the layout label (-234 -8 = -242): 484px centred in
# 616, so 66px of padding at both ends.

# bottom bar (battery · network · uptime) and now-playing are anchored to the
# screen edge, not the card, so the card can be resized without touching them.

# ── Rose Pine Moon ──────────────────────────────────────────────────────────
# Everything between the two markers is rewritten from the wallpaper by
# ~/.config/hypr/scripts/apply-theme.sh. Edit matugen/templates/hyprlock-colors.conf,
# not this block -- changes here are overwritten on the next wallpaper change.
# >>> matugen palette >>>
$base    = rgb(13, 20, 28)
$surface = rgb(26, 32, 40)
$overlay = rgb(36, 42, 51)
$muted   = rgb(139, 145, 155)
$subtle  = rgb(193, 199, 210)
$text    = rgb(221, 227, 238)
$love    = rgb(212, 134, 176)
$gold    = rgb(221, 208, 144)
$rose    = rgb(199, 192, 229)
$pine    = rgb(58, 119, 134)
$foam    = rgb(160, 167, 212)
$iris    = rgb(175, 197, 223)
$bgTint      = rgba(13, 20, 28, 0.55)
$bgWash      = rgba(58, 119, 134, 0.07)
$cardShadow  = rgba(8, 15, 22, 0.35)
$cardFill    = rgba(26, 32, 40, 0.62)
$cardBorder  = rgba(175, 197, 223, 0.22)
$hairline    = rgba(139, 145, 155, 0.28)
$clockShadow = rgba(8, 15, 22, 0.55)
$inputRing   = rgba(175, 197, 223, 0.35)
$inputFill   = rgba(13, 20, 28, 0.78)
# <<< matugen palette <<<

$font    = JetBrainsMono Nerd Font
$info    = ~/.config/hypr/scripts/lock-info.sh

general {
    hide_cursor         = true
    # grace lives on the CLI in 0.9.x (`hyprlock --grace N`), not in this
    # block; it is left at the default 0 -- an idle lock that hands the desktop
    # back on a keypress is not a lock.
    ignore_empty_input  = true
    immediate_render    = true
    fractional_scaling  = 2
}

auth {
    pam {
        enabled = true
    }
    # Enable if this machine's reader is enrolled: fprintd-enroll first,
    # otherwise hyprlock sits on "fingerprint scan failed" forever.
    fingerprint {
        enabled = false
    }
}

# ── Background ──────────────────────────────────────────────────────────────
# Kept dark and heavily blurred on purpose: the card below is translucent, and
# a busy wallpaper showing through it destroys the contrast on the clock.
background {
    monitor           =
    path              = ~/.config/hypr/current-wallpaper
    blur_size         = 7
    blur_passes       = 4
    noise             = 0.0140
    contrast          = 0.90
    brightness        = 0.42
    vibrancy          = 0.16
    vibrancy_darkness = 0.30
}

# Base tint. Pulls the whole frame toward $base so every wallpaper lands on the
# same background value and the palette stays predictable.
background {
    monitor = 
    color   = $bgTint
}

# Pine wash. A cold cast over the warm wallpapers, ties the screen to the bar.
background {
    monitor = 
    color   = $bgWash
}

# ── Glass card ──────────────────────────────────────────────────────────────
# Shadow first, then the card, so the card paints over the shadow's inner edge.
shape {
    monitor      = 
    size         = 640, 628
    color        = $cardShadow
    rounding     = 30
    border_size  = 0
    position     = 0, -6
    halign       = center
    valign       = center
}

shape {
    monitor      = 
    size         = 628, 616
    color        = $cardFill
    rounding     = 28
    border_size  = 2
    border_color = $cardBorder
    position     = 0, 0
    halign       = center
    valign       = center
}

# ── Identity ────────────────────────────────────────────────────────────────
label {
    monitor     = 
    text        = $USER
    color       = $text
    font_size   = 21
    font_family = $font
    position    = 0, 227
    halign      = center
    valign      = center
}

label {
    monitor     = 
    text        = cmd[update:0] ~/.config/hypr/scripts/lock-info.sh host
    color       = $muted
    font_size   = 11
    font_family = $font
    position    = 0, 201
    halign      = center
    valign      = center
}

# Hairline. A 1px shape is cheaper and crisper than a row of box-drawing glyphs.
shape {
    monitor     = 
    size        = 420, 1
    color       = $hairline
    rounding    = 0
    border_size = 0
    position    = 0, 169
    halign      = center
    valign      = center
}

# ── Clock ───────────────────────────────────────────────────────────────────
# Two stacked labels: a dim offset copy under a bright one. Cheap drop shadow,
# and it keeps the time readable when the wallpaper behind is pale.
label {
    monitor     = 
    text        = $TIME
    color       = $clockShadow
    font_size   = 82
    font_family = $font
    position    = 3, 74
    halign      = center
    valign      = center
}

label {
    monitor     = 
    text        = $TIME
    color       = $text
    font_size   = 82
    font_family = $font
    position    = 0, 77
    halign      = center
    valign      = center
}

label {
    monitor     = 
    text        = cmd[update:30000] date '+%A, %d %B'
    color       = $subtle
    font_size   = 15
    font_family = $font
    position    = 0, 15
    halign      = center
    valign      = center
}

# ── Greeting ────────────────────────────────────────────────────────────────
# update:600000 rather than 0: the wording changes with the time of day, and a
# machine left locked overnight should not still be saying "good afternoon".
label {
    monitor     = 
    text        = cmd[update:600000] ~/.config/hypr/scripts/lock-info.sh greet
    color       = $iris
    font_size   = 13
    font_family = $font
    position    = 0, -55
    halign      = center
    valign      = center
}

# ── Password ────────────────────────────────────────────────────────────────
input-field {
    monitor           = 
    size              = 400, 56
    outline_thickness = 2
    dots_size         = 0.24
    dots_spacing      = 0.32
    dots_center       = true
    dots_rounding     = -1

    outer_color   = $inputRing
    inner_color   = $inputFill
    font_color    = $text
    font_family   = $font
    check_color   = $foam
    fail_color    = $love
    capslock_color = $gold

    # $ATTEMPTS renders the running count, so a failed unlock says how many
    # times, not just that it happened.
    placeholder_text = <span foreground="##6e6a86"><i>󰌾  enter password</i></span>
    fail_text        = <span foreground="##eb6f92">  $FAIL <b>($ATTEMPTS)</b></span>
    fade_on_empty = false
    hide_input    = false
    rounding      = 14

    shadow_passes = 3
    shadow_size   = 7
    shadow_color  = rgba(0, 0, 0, 0.60)
    shadow_boost  = 1.2

    position = 0, -123
    halign   = center
    valign   = center
}

# ── Caps lock ───────────────────────────────────────────────────────────────
# Prints nothing when caps is off, so this row costs no vertical space unless
# it has something to say.
label {
    monitor     = 
    text        = cmd[update:400] ~/.config/hypr/scripts/lock-info.sh caps
    color       = $love
    font_size   = 12
    font_family = $font
    position    = 0, -193
    halign      = center
    valign      = center
}

# ── Keyboard layout ─────────────────────────────────────────────────────────
label {
    monitor     = 
    text        = <span foreground="##6e6a86">󰌌  $LAYOUT</span>
    color       = $muted
    font_size   = 11
    font_family = $font
    position    = 0, -234
    halign      = center
    valign      = center
}

# ── Bottom status row ───────────────────────────────────────────────────────
# battery · network · uptime, assembled in one script call so the separators
# cannot drift out of alignment as the segments change width.
label {
    monitor     = 
    text        = cmd[update:20000] ~/.config/hypr/scripts/lock-info.sh statusbar
    color       = $subtle
    font_size   = 13
    font_family = $font
    position    = 0, 64
    halign      = center
    valign      = bottom
}

# ── Now playing ─────────────────────────────────────────────────────────────
label {
    monitor     = 
    text        = cmd[update:5000] ~/.config/hypr/scripts/lock-info.sh player
    color       = $iris
    font_size   = 12
    font_family = $font
    position    = -40, 40
    halign      = right
    valign      = bottom
}

# ── Kernel, bottom left ─────────────────────────────────────────────────────
label {
    monitor     = 
    text        = cmd[update:0] ~/.config/hypr/scripts/lock-info.sh kernel
    color       = $muted
    font_size   = 12
    font_family = $font
    position    = 40, 40
    halign      = left
    valign      = bottom
}

# ── Animations ──────────────────────────────────────────────────────────────
animations {
    enabled = true

    bezier = snap,   0.16, 1,    0.30, 1
    bezier = easeIn, 0.70, 0,    0.84, 1

    animation = global,           1, 6,  snap
    animation = fade,             1, 5,  snap
    animation = fadeIn,           1, 5,  snap
    animation = fadeOut,          1, 3,  easeIn
    animation = inputFieldDots,   1, 2,  snap
    animation = inputFieldColors, 1, 8,  snap
    animation = inputFieldFade,   1, 3,  snap
    animation = inputFieldWidth,  1, 3,  snap
}
