
# ── Rose Pine Colors ──────────────────────────────────────────────
$base     = rgba(191724ff)
$pine     = rgba(31748fff)
$foam     = rgba(9ccfd8ff)
$iris     = rgba(c4a7e7ff)
$love     = rgba(eb6f92ff)
$gold     = rgba(f6c177ff)
$rose     = rgba(ebbcbaff)
$muted    = rgba(6e6a86ff)
$subtle   = rgba(908caaff)
$text     = rgba(e0def4ff)
$overlay  = rgba(26233aff)

# ── Deep overlay layer ────────────────────────────────────────────
background {
    monitor =
    color   = rgba(19, 17, 28, 0.6)
}

# ── Rose-pine atmosphere layer ────────────────────────────────────
background {
    monitor =
    color   = rgba(49, 116, 143, 0.10)
}

# ── Session label ─────────────────────────────────────────────────
label {
    monitor     =
    text        = "wake up h3bzzz"
    color       = $iris
    font_size   = 13
    font_family = JetBrainsMono Nerd Font

    position = 0, 220
    halign   = center
    valign   = center
}

# ── Clock: large, centered ────────────────────────────────────────
label {
    monitor     =
    text        = cmd[update:1000] echo "$(date +"%H:%M")"
    color       = $text
    font_size   = 72
    font_family = JetBrainsMono Nerd Font

    position = 0, 130
    halign   = center
    valign   = center
}

# ── Date: smaller, muted ──────────────────────────────────────────
label {
    monitor     =
    text        = cmd[update:60000] echo "$(date +"%A, %B %d")"
    color       = $subtle
    font_size   = 16
    font_family = JetBrainsMono Nerd Font

    position = 0, 60
    halign   = center
    valign   = center
}

# ── Password input field ──────────────────────────────────────────
input-field {
    monitor          =
    size             = 360, 52
    outline_thickness = 2
    dots_size        = 0.22
    dots_spacing     = 0.3
    dots_center      = true

    outer_color  = rgba(49, 116, 143, 0.6)
    inner_color  = rgba(38, 35, 58, 0.85)
    font_color   = $text
    font_family  = JetBrainsMono Nerd Font

    fade_on_empty  = true
    fade_timeout   = 1200

    placeholder_text = <span foreground="##6e6a86">  enter password</span>

    check_color  = $foam
    fail_color   = $love
    fail_text    = <span foreground="##eb6f92">  incorrect</span>

    position = 0, -6
    halign   = center
    valign   = center

    rounding      = 10
    shadow_passes = 3
    shadow_size   = 6
    shadow_color  = rgba(0, 0, 0, 0.55)
}

# ── Username ──────────────────────────────────────────────────────
label {
    monitor     =
    text        = $USER
    color       = $muted
    font_size   = 13
    font_family = JetBrainsMono Nerd Font

    position = 0, -80
    halign   = center
    valign   = center
}

label {
    monitor     =
    text        = "unlock to continue"
    color       = $subtle
    font_size   = 12
    font_family = JetBrainsMono Nerd Font

    position = 0, -60
    halign   = center
    valign   = center
}

# ── Caps Lock warning ─────────────────────────────────────────────
label {
    monitor     =
    text        = cmd[update:500] ~/.config/hypr/scripts/check-caps.sh
    color       = $love
    font_size   = 12
    font_family = JetBrainsMono Nerd Font

    position = 0, -112
    halign   = center
    valign   = center
}

# ── Animations ────────────────────────────────────────────────────
animations {
    enabled = true

    bezier = easeOut,  0.16, 1, 0.3, 1
    bezier = easeIn,   0.7,  0, 0.84, 0

    animation = fadeIn,           1, 5, easeOut
    animation = fadeOut,          1, 3, easeIn
    animation = inputFieldFade,   1, 2, easeOut
    animation = inputFieldColors, 1, 8, easeOut
}
