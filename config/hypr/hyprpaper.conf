# hyprpaper 0.8+ -- wallpapers are declared per monitor; `preload` is gone.
#
# An empty `monitor` is the fallback for every output without its own block.
# Every screen shows the same image here, so one catch-all block serves the
# laptop panel, the desktop's two outputs, and anything hot-plugged later.
#
# current-wallpaper is a symlink that set-wallpaper.sh repoints and then
# restarts hyprpaper against this file.

wallpaper {
    monitor =
    path = ~/.config/hypr/current-wallpaper
    fit_mode = cover
}

splash = false
ipc = true
