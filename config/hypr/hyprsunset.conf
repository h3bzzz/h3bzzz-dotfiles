# hyprsunset -- blue-light filter. Unlike a screen shader it is not captured
# in screenshots or recordings.
#
# The profiles below make it automatic: neutral during the day, warm from
# 20:00. SUPER + SHIFT + N (scripts/toggle.sh nightlight) overrides either way
# until the next profile boundary.

max-gamma = 100

profile {
    time = 7:00
    identity = true
}

profile {
    time = 20:00
    temperature = 4000
}
