# ~/.config/hypr/thornwatch/thornwatch.conf
# thornwatch -- Rose Pine idle screensaver for Hyprland
# Sourced by ctl.sh and thornwatch.sh. Plain shell assignments only.

# --- timing -------------------------------------------------------------
# How long a finished frame sits on screen before the next one is drawn.
TW_HOLD_MIN=4
TW_HOLD_MAX=8

# How often the input watcher polls the pointer, in seconds.
TW_POLL=0.4

# --- terminal -----------------------------------------------------------
TW_TERM=ghostty                 # ghostty | foot
TW_CLASS=dev.h3bzzz.thornwatch   # GTK app-id: ghostty requires at least one dot
TW_FONT_SIZE=15
TW_FONT_FAMILY="JetBrainsMono Nerd Font"

# --- rendering ----------------------------------------------------------
# Glyph used by the built-in block font. Try █ ▓ ▒ ░ ■ or a nerd-font glyph.
TW_FILL="█"

# Terminal background, fed to tte so fade-in/out lands on the right colour.
TW_BG=191724

# Panels to rotate through. Names match panels/<name>.sh, order irrelevant.
TW_PANELS="sigil clock vitals recon forge lore"

# Weights: how many times each panel is entered into the draw bag.
# Higher = shows up more often.
TW_WEIGHT_sigil=1
TW_WEIGHT_clock=3
TW_WEIGHT_vitals=2
TW_WEIGHT_recon=2
TW_WEIGHT_forge=2
TW_WEIGHT_lore=3

# Effects that are never picked (too slow, too noisy, or unreadable at size).
TW_EFFECT_DENY="blackhole bubbles bouncyballs"

# --- behaviour ----------------------------------------------------------
# Restore brightness when the saver starts, so the dim listener does not
# leave the effects invisible.
TW_UNDIM=1

# Seconds the saver runs before it locks the screen itself. hypridle's own
# hard-lock listener cannot be relied on for this: the saver's window map
# counts as activity and restarts hypridle's idle clock, so its 15-minute
# listener would measure from the wrong moment. 300 = saver at 10 min, lock at
# 15 min. Set to 0 to let the saver run until someone comes back.
TW_LOCK_AFTER=${TW_LOCK_AFTER:-300}

# Seconds after a start during which a hypridle resume is assumed to be the
# echo of our own window appearing rather than a human. See ctl.sh.
TW_WAKE_GRACE=${TW_WAKE_GRACE:-6}
