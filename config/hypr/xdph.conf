# xdg-desktop-portal-hyprland
# Read automatically from ~/.config/hypr/xdph.conf

screencopy {
    # Remember the share permission per app instead of re-prompting the picker
    # on every single capture request.
    allow_token_by_default = true

    # Optional: thumbnail-preview picker from the AUR package
    # `hyprland-preview-share-picker`. The stock picker from hyprland-guiutils
    # is used when this is left commented out.
    # custom_picker_binary = hyprland-preview-share-picker
}
