# vim:fileencoding=utf-8:foldmethod=marker
# Rose Pine Moon Kitty Configuration

# ============================================
# FONTS
# ============================================
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# Font rendering tweaks
modify_font      cell_width 95%
disable_ligatures cursor

# ============================================
# ROSE PINE MOON COLOR SCHEME
# ============================================
foreground       #e0def4
background       #232136

# Cursor
cursor           #56526e
cursor_text_color #e0def4

# Selection
selection_foreground #e0def4
selection_background #44415a

# Tabs
active_tab_foreground   #e0def4
active_tab_background   #393552
active_tab_font_style   bold
inactive_tab_foreground #908caa
inactive_tab_background #232136
inactive_tab_font_style normal

# Window borders
active_border_color   #3e8fb0
inactive_border_color #44415a
bell_border_color     #f6c177

# URL highlighting
url_color #c4a7e7
url_style curly

# Color palette
color0  #393552
color1  #eb6f92
color2  #3e8fb0
color3  #f6c177
color4  #9ccfd8
color5  #c4a7e7
color6  #ea9a97
color7  #e0def4
color8  #6e6a86
color9  #eb6f92
color10 #3e8fb0
color11 #f6c177
color12 #9ccfd8
color13 #c4a7e7
color14 #ea9a97
color15 #e0def4

# ============================================
# TRANSPARENCY & BLUR
# ============================================
background_opacity 0.88
dynamic_background_opacity no

# ============================================
# WINDOW LAYOUT
# ============================================
window_margin_width        6
single_window_margin_width 0
window_padding_width       8
window_border_width        1.5pt
draw_minimal_borders       yes
placement_strategy         center

# Fade inactive windows slightly
inactive_text_alpha 0.85

# Hide window decorations for clean Hyprland look
hide_window_decorations titlebar-only

# ============================================
# TAB BAR
# ============================================
tab_bar_edge          top
tab_bar_style         powerline
tab_powerline_style   slanted
tab_bar_min_tabs      2

# ============================================
# SCROLLBACK
# ============================================
scrollback_lines        10000
scrollback_pager_history_size 512
scrollback_fill_enlarged_window yes

# Scrollbar
scrollbar             hovered
scrollbar_width       0.4
scrollbar_handle_color #6e6a86
scrollbar_track_opacity 0

# ============================================
# PERFORMANCE
# ============================================
repaint_delay     6
input_delay       1
sync_to_monitor   yes

# ============================================
# CURSOR
# ============================================
cursor_shape          block
cursor_shape_unfocused hollow
cursor_blink_interval 0
cursor_trail          0

# ============================================
# MOUSE
# ============================================
mouse_hide_wait       2.0
copy_on_select        no
select_by_word_characters @-./_~?&=%+#

# ============================================
# TERMINAL BELL
# ============================================
enable_audio_bell     no
visual_bell_duration  0.15
window_alert_on_bell  no

# ============================================
# SHELL INTEGRATION
# ============================================
shell_integration     no-cursor

# ============================================
# KEYMAPS
# ============================================
# Config management
map ctrl+shift+f5     load_config_file
map ctrl+shift+f2     edit_config

# Window management
map ctrl+shift+enter  new_window
map ctrl+shift+w      close_window
map ctrl+shift+space  toggle_layout stack

# Tab management
map ctrl+shift+t      new_tab
map ctrl+shift+q      close_tab
map ctrl+shift+right  next_tab
map ctrl+shift+left   previous_tab
map ctrl+shift+.      move_tab_forward
map ctrl+shift+,      move_tab_backward

# Font size
map ctrl+equal        change_font_size all +2.0
map ctrl+minus        change_font_size all -2.0
map ctrl+0            change_font_size all 0

# Layouts
map ctrl+shift+l      next_layout

# Clipboard
map ctrl+shift+c      copy_to_clipboard
map ctrl+shift+v      paste_from_clipboard

# Scrollback
map ctrl+shift+up     scroll_line_up
map ctrl+shift+down   scroll_line_down
map ctrl+shift+page_up scroll_page_up
map ctrl+shift+page_down scroll_page_down

# Marks / command browsing
map ctrl+shift+g      show_last_command_output
map ctrl+shift+z      scroll_to_prompt -1
map ctrl+shift+x      scroll_to_prompt 1

# Quick window resize
map ctrl+shift+up     resize_window taller 2
map ctrl+shift+down   resize_window shorter 2
map ctrl+shift+left   resize_window wider 2
map ctrl+shift+right  resize_window narrower 2

# ============================================
# MISC
# ============================================
detect_urls           yes
open_url_with         default
env                   TERM=xterm-kitty
allow_remote_control  yes
listen_on             unix:/tmp/kitty
