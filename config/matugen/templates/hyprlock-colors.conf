# Generated by matugen from the current wallpaper. Do not edit by hand.
# Regenerate: ~/.config/hypr/scripts/apply-theme.sh
#
# hyprlock 0.9.6 has no `source` directive -- hyprlang leaves that to
# Hyprland -- so apply-theme.sh splices this file into hyprlock.conf between
# its palette markers instead of hyprlock reading it.
#
# hyprlang substitutes a variable as the whole value, so every translucent
# shade hyprlock.conf needs is composed here and named, rather than the
# stylesheet spelling out rgba() triples that would stop tracking the
# wallpaper.
#
# The accents are spelled r, g, b: matugen 4.2 re-parses any colour-shaped
# string in --import-json-string into a colour object, so `accent.love.rgb`
# resolves to that object and renders as a debug dump. The integer fields
# come through untouched.

# ── Palette ─────────────────────────────────────────────────────────────
$base    = {{colors.surface.default.rgb}}
$surface = {{colors.surface_container.default.rgb}}
$overlay = {{colors.surface_container_high.default.rgb}}
$muted   = {{colors.outline.default.rgb}}
$subtle  = {{colors.on_surface_variant.default.rgb}}
$text    = {{colors.on_surface.default.rgb}}
$love    = rgb({{accent.love.r}}, {{accent.love.g}}, {{accent.love.b}})
$gold    = rgb({{accent.gold.r}}, {{accent.gold.g}}, {{accent.gold.b}})
$rose    = rgb({{accent.rose.r}}, {{accent.rose.g}}, {{accent.rose.b}})
$pine    = rgb({{accent.pine.r}}, {{accent.pine.g}}, {{accent.pine.b}})
$foam    = rgb({{accent.foam.r}}, {{accent.foam.g}}, {{accent.foam.b}})
$iris    = rgb({{accent.iris.r}}, {{accent.iris.g}}, {{accent.iris.b}})

# ── Composed shades ─────────────────────────────────────────────────────
# Shadows sit on surface_container_lowest rather than on $base: they have to
# read as darker than the card they fall behind, at every wallpaper.
$bgTint      = rgba({{colors.surface.default.red}}, {{colors.surface.default.green}}, {{colors.surface.default.blue}}, 0.55)
$bgWash      = rgba({{accent.pine.r}}, {{accent.pine.g}}, {{accent.pine.b}}, 0.07)
$cardShadow  = rgba({{colors.surface_container_lowest.default.red}}, {{colors.surface_container_lowest.default.green}}, {{colors.surface_container_lowest.default.blue}}, 0.35)
$cardFill    = rgba({{colors.surface_container.default.red}}, {{colors.surface_container.default.green}}, {{colors.surface_container.default.blue}}, 0.62)
$cardBorder  = rgba({{accent.iris.r}}, {{accent.iris.g}}, {{accent.iris.b}}, 0.22)
$hairline    = rgba({{colors.outline.default.red}}, {{colors.outline.default.green}}, {{colors.outline.default.blue}}, 0.28)
$clockShadow = rgba({{colors.surface_container_lowest.default.red}}, {{colors.surface_container_lowest.default.green}}, {{colors.surface_container_lowest.default.blue}}, 0.55)
$inputRing   = rgba({{accent.iris.r}}, {{accent.iris.g}}, {{accent.iris.b}}, 0.35)
$inputFill   = rgba({{colors.surface.default.red}}, {{colors.surface.default.green}}, {{colors.surface.default.blue}}, 0.78)
