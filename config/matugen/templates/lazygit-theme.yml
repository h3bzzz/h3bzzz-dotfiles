# Generated by matugen from the current wallpaper. Do not edit by hand.
# Regenerate: ~/.config/hypr/scripts/apply-theme.sh
gui:
  nerdFontsVersion: "3"
  theme:
    activeBorderColor:
      - "{{accent.iris.hex}}"
      - bold
    inactiveBorderColor:
      - "{{colors.outline.default.hex}}"
    searchingActiveBorderColor:
      - "{{accent.gold.hex}}"
    optionsTextColor:
      - "{{accent.foam.hex}}"
    selectedLineBgColor:
      - "{{colors.surface_container_high.default.hex}}"
    cherryPickedCommitBgColor:
      - "{{colors.surface_container_high.default.hex}}"
    cherryPickedCommitFgColor:
      - "{{accent.iris.hex}}"
    unstagedChangesColor:
      - "{{accent.love.hex}}"
    defaultFgColor:
      - "{{colors.on_surface.default.hex}}"
git:
  paging:
    colorArg: always
    pager: delta --dark --paging=never --syntax-theme=ansi
