# Generated by matugen from the current wallpaper. Do not edit by hand.
# Regenerate: ~/.config/hypr/scripts/apply-theme.sh
#
# These are the styling lines rather than a set of colour variables,
# because tmux scopes config variables to the file that defines them --
# a sourced palette does not reach the `set -g` lines in tmux.conf, which
# silently fall back to tmux's own defaults. Inlining the hex avoids it.

set -g status-style "fg={{colors.on_surface_variant.default.hex}},bg={{colors.surface_container.default.hex}}"
set -g pane-border-style "fg={{colors.surface_container_high.default.hex}},bg={{colors.surface.default.hex}}"
set -g pane-active-border-style "fg={{accent.foam.hex}},bg={{colors.surface.default.hex}}"
set -g message-style "bg={{accent.pine.hex}},fg={{colors.on_surface.default.hex}}"
setw -g window-status-style "fg={{colors.on_surface_variant.default.hex}},bg={{colors.surface_container_high.default.hex}}"
setw -g window-status-current-style "fg={{colors.surface.default.hex}},bg={{accent.foam.hex}}"
setw -g window-status-activity-style "fg={{colors.surface.default.hex}},bg={{accent.iris.hex}}"
set -g status-left "#[fg={{colors.surface.default.hex}},bg={{accent.foam.hex}}] #S #[fg={{accent.foam.hex}},bg={{colors.surface_container.default.hex}},nobold,nounderscore,noitalics]"
set -g status-right "#[fg={{accent.foam.hex}},bg={{colors.surface_container.default.hex}}]#[fg={{colors.surface.default.hex}},bg={{accent.foam.hex}}] %H:%M  %d-%b-%y "
setw -g window-status-format " #[fg={{colors.surface_container_high.default.hex}},bg={{colors.surface_container.default.hex}}]#[fg={{colors.on_surface_variant.default.hex}},bg={{colors.surface_container_high.default.hex}}] #I  #W #[fg={{colors.surface_container_high.default.hex}},bg={{colors.surface_container.default.hex}}]"
setw -g window-status-current-format " #[fg={{colors.surface_container.default.hex}},bg={{colors.surface_container.default.hex}}]#[fg={{colors.surface.default.hex}},bg={{accent.foam.hex}}] #I  #W #[fg={{accent.foam.hex}},bg={{colors.surface_container.default.hex}}]"
setw -g clock-mode-colour "{{accent.foam.hex}}"
setw -g mode-style "fg={{colors.surface.default.hex}},bg={{accent.foam.hex}}"
