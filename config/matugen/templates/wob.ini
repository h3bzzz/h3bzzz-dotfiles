# Generated by matugen from the current wallpaper. Do not edit by hand.
# Regenerate: ~/.config/hypr/scripts/apply-theme.sh
# wob OSD -- spawned per-session by ~/.config/hypr/scripts/osd-wob.sh.
# volume.sh / brightness.sh write slider values into the per-instance fifo.
# Values are unquoted: wob's parser rejects quoted values outright.
anchor = bottom
margin = 32
width = 320
height = 28
border_size = 2
border_offset = 4
bar_padding = 4
border_color = {{colors.surface_container_high.default.hex_stripped}}FF
background_color = {{colors.surface.default.hex_stripped}}EE
bar_color = {{accent.pine.hexs}}EE
overflow_background_color = {{colors.surface_container.default.hex_stripped}}EE
overflow_bar_color = {{accent.iris.hexs}}EE
overflow_mode = wrap
