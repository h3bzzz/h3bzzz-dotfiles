# Generated by matugen from the current wallpaper. Do not edit by hand.
# Regenerate: ~/.config/hypr/scripts/apply-theme.sh
[mgr]
cwd = { fg = "{{accent.foam.hex}}" }
hovered = { fg = "{{colors.surface.default.hex}}", bg = "{{accent.iris.hex}}" }
preview_hovered = { underline = true }
find_keyword = { fg = "{{accent.gold.hex}}", bold = true }
find_position = { fg = "{{accent.rose.hex}}", bg = "reset", bold = true }
marker_copied = { fg = "{{accent.foam.hex}}", bg = "{{accent.foam.hex}}" }
marker_cut = { fg = "{{accent.love.hex}}", bg = "{{accent.love.hex}}" }
marker_marked = { fg = "{{accent.iris.hex}}", bg = "{{accent.iris.hex}}" }
marker_selected = { fg = "{{accent.gold.hex}}", bg = "{{accent.gold.hex}}" }
tab_active = { fg = "{{colors.surface.default.hex}}", bg = "{{accent.iris.hex}}" }
tab_inactive = { fg = "{{colors.on_surface_variant.default.hex}}", bg = "{{colors.surface_container_high.default.hex}}" }
border_style = { fg = "{{colors.outline.default.hex}}" }

[mode]
normal_main = { fg = "{{colors.surface.default.hex}}", bg = "{{accent.iris.hex}}", bold = true }
normal_alt  = { fg = "{{accent.iris.hex}}", bg = "{{colors.surface_container_high.default.hex}}" }
select_main = { fg = "{{colors.surface.default.hex}}", bg = "{{accent.pine.hex}}", bold = true }
select_alt  = { fg = "{{accent.pine.hex}}", bg = "{{colors.surface_container_high.default.hex}}" }
unset_main  = { fg = "{{colors.surface.default.hex}}", bg = "{{accent.love.hex}}", bold = true }
unset_alt   = { fg = "{{accent.love.hex}}", bg = "{{colors.surface_container_high.default.hex}}" }

[status]
overall = { fg = "{{colors.on_surface.default.hex}}", bg = "{{colors.surface_container.default.hex}}" }
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }

[input]
border = { fg = "{{accent.iris.hex}}" }
title = {}
value = {}
selected = { reversed = true }

[pick]
border   = { fg = "{{accent.iris.hex}}" }
active   = { fg = "{{accent.rose.hex}}", bold = true }
inactive = {}

[confirm]
border = { fg = "{{accent.iris.hex}}" }
title = { fg = "{{accent.iris.hex}}" }

[filetype]
rules = [
  { mime = "image/*", fg = "{{accent.gold.hex}}" },
  { mime = "video/*", fg = "{{accent.rose.hex}}" },
  { mime = "audio/*", fg = "{{accent.rose.hex}}" },
  { mime = "application/*zip", fg = "{{accent.love.hex}}" },
  { mime = "application/x-tar", fg = "{{accent.love.hex}}" },
  { name = "*/", fg = "{{accent.foam.hex}}" },
  { name = "*", fg = "{{colors.on_surface.default.hex}}" },
]
