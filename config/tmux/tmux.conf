unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Start at 1
set -g base-index 1
setw -g pane-base-index 1

# Renumber
set -g renumber-windows on

# Mouse Support
set -g mouse on

# Scroll Buffer
set -g history-limit 50000

# Color Support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Faster Cmd
set -s escape-time 0

# Display
set -g display-time 2000
set -g status-interval 5
set -g focus-events on

# Palette. matugen regenerates colors.conf from the wallpaper on every theme
# change; -q so a fresh checkout without a generated palette still starts.
# Palette + every style that uses it. matugen regenerates colors.conf from
# the wallpaper; -q so a checkout without a generated palette still starts.
source-file -q ~/.config/tmux/colors.conf

# Key Binds
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"

# Split Panes
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Switch Panes
bind -n M-left select-pane -L
bind -n M-right select-pane -R
bind -n M-up select-pane -U
bind -n M-down select-pane -D

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

setw -g mode-keys vi

bind [ copy-mode

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy"

bind ] run "wl-paste | tmux load-buffer - && tmux paste-buffer"
bind p run "wl-paste | tmux load-buffer - && tmux paste-buffer"

# Style

setw -g window-status-separator ""

set -g status-left-length 60
set -g status-right-length 120

# Formats




setw -g monitor-activity on
set -g visual-activity off
set -g set-titles on
set -g set-titles-string "#T"

set -gq allow-passthrough on
set-option -g focus-events on
