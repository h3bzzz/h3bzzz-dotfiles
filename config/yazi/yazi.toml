# yazi — TUI file manager.
# theme.toml beside this file is generated by matugen from the wallpaper;
# this file is source. Regenerate colours: ~/.config/hypr/scripts/apply-theme.sh

[mgr]
ratio          = [1, 3, 4]
sort_by        = "natural"
sort_dir_first = true
show_hidden    = false
show_symlink   = true
linemode       = "size"

[preview]
# Ghostty speaks the Kitty graphics protocol, so images render inline rather
# than as an ASCII approximation. yazi picks the adapter up automatically.
max_width  = 1200
max_height = 1200
image_filter = "lanczos3"
image_quality = 90
